<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Zahlung abgeschlossen – GeburtstagsQuest</title><link rel="stylesheet" href="assets/style.css"></head><body><main class="thankyou"><div class="success">✓</div><div class="eyebrow">BESTELLUNG</div><h1 id="title">Vielen Dank für deine Bestellung.</h1><p id="status">Deine Bestellung wurde erfasst. Wir prüfen den Zahlungsstatus und erstellen anschließend deine persönliche GeburtstagsQuest.</p><div id="actions" style="margin-top:28px"><a class="btn" href="index.html">Zur Startseite</a></div></main><script src="assets/config.js"></script><script>(async function(){const p=new URLSearchParams(location.search);const sessionId=p.get('session_id');let orderId=p.get('order_id')||localStorage.getItem('geburtstagsquest_order_id');const title=document.getElementById('title');const status=document.getElementById('status');const api=((window.GQ_CONFIG||{}).API_BASE||'').replace(/\/$/,'');if(!sessionId){title.textContent='Bestellung erfasst';status.textContent='Die Bestellung ist gespeichert. Falls du den Checkout abgeschlossen hast, prüfen wir die Zahlung und erstellen anschließend deine GeburtstagsQuest.';return;}async function recoverOrder(){if(orderId||!api)return orderId;for(let i=0;i<6;i++){try{const r=await fetch(api+'/api/order-by-session?session_id='+encodeURIComponent(sessionId));const d=await r.json();if(r.ok&&d.found&&d.order_id){orderId=d.order_id;localStorage.setItem('geburtstagsquest_order_id',orderId);return orderId;}}catch(e){}await new Promise(resolve=>setTimeout(resolve,1500));}return null;}await recoverOrder();if(!orderId){title.textContent='Vielen Dank für deine Zahlung.';status.textContent='Die Zahlung ist eingegangen. Deine Bestellung wird gerade zugeordnet und die GeburtstagsQuest anschließend erstellt.';return;}try{const r=await fetch(api+'/api/order-by-session?session_id='+encodeURIComponent(sessionId));const d=await r.json();if(r.ok&&d.found){localStorage.setItem('geburtstagsquest_paid_order_id',orderId);title.textContent='Vielen Dank – die Zahlung ist eingegangen.';status.textContent=d.status==='delivered'?'Deine GeburtstagsQuest wurde bereits erstellt und versendet.':'Deine Bestellung ist sicher erfasst. Das personalisierte Abenteuer wird jetzt erstellt und anschließend per E-Mail versendet.';return;}}catch(e){}title.textContent='Vielen Dank für deine Bestellung.';status.textContent='Deine Bestellung ist sicher erfasst. Wir erstellen anschließend deine persönliche GeburtstagsQuest.';})();</script></body></html>
