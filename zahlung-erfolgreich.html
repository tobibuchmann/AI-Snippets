<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Zahlung abgeschlossen – GeburtstagsQuest</title><link rel="stylesheet" href="assets/style.css"></head><body><main class="thankyou"><div class="success">✓</div><div class="eyebrow">BESTELLUNG</div><h1 id="title">Vielen Dank für deine Bestellung.</h1><p id="status">Deine Bestellung wurde erfasst. Wir prüfen den Zahlungsstatus und erstellen anschließend deine persönliche GeburtstagsQuest.</p><div id="actions" style="margin-top:28px"><a class="btn" href="index.html">Zur Startseite</a></div></main><script src="assets/config.js"></script><script>(async function(){const p=new URLSearchParams(location.search);const sessionId=p.get('session_id');const orderId=p.get('order_id')||localStorage.getItem('geburtstagsquest_order_id');const title=document.getElementById('title');const status=document.getElementById('status');if(!sessionId){title.textContent='Bestellung erfasst';status.textContent='Die Bestellung ist gespeichert. Falls du den Checkout abgeschlossen hast, prüfen wir die Zahlung und erstellen anschließend deine GeburtstagsQuest.';return;}if(!orderId){title.textContent='Vielen Dank für deine Zahlung.';status.textContent='Stripe hat dich nach dem Checkout zurückgeleitet. Wir ordnen die Zahlung deiner Bestellung zu und erstellen anschließend deine GeburtstagsQuest.';return;}const api=(window.GQ_CONFIG.API_BASE||'').replace(/\/$/,'');try{const r=await fetch(api+'/api/checkout-status?session_id='+encodeURIComponent(sessionId)+'&order_id='+encodeURIComponent(orderId));const d=await r.json();if(r.ok&&d.paid){title.textContent='Vielen Dank – die GeburtstagsQuest ist bezahlt.';status.textContent='Deine Bestellung ist sicher erfasst. Als Nächstes wird das personalisierte Abenteuer erstellt.';localStorage.setItem('geburtstagsquest_paid_order_id',orderId);return;}if(d.error==='payment_verification_not_configured'){title.textContent='Vielen Dank für deine Bestellung.';status.textContent='Deine Bestellung ist sicher erfasst. Wir prüfen die Zahlung und erstellen anschließend deine persönliche GeburtstagsQuest.';return;}throw new Error(d.error||'payment_not_confirmed');}catch(e){title.textContent='Vielen Dank für deine Bestellung.';status.textContent='Deine Bestellung ist sicher erfasst. Wir prüfen die Zahlung und erstellen anschließend deine persönliche GeburtstagsQuest.';}})();</script></body></html>
