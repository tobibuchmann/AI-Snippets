<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Zahlung erfolgreich – GeburtstagsQuest</title><link rel="stylesheet" href="assets/style.css"></head><body><main class="thankyou"><div class="success">✓</div><div class="eyebrow">ZAHLUNG</div><h1 id="title">Zahlung wird geprüft …</h1><p id="status">Einen Moment – wir gleichen die Bestellung mit der Zahlung ab.</p><div id="actions" style="display:none;margin-top:28px"><a class="btn" href="index.html">Zur Startseite</a></div></main><script src="assets/config.js"></script><script>(async function(){const p=new URLSearchParams(location.search);const sessionId=p.get('session_id');const orderId=p.get('order_id');const title=document.getElementById('title');const status=document.getElementById('status');const actions=document.getElementById('actions');if(!sessionId||!orderId){title.textContent='Bestellung nicht gefunden';status.textContent='Bitte öffne diese Seite über den Stripe-Checkout.';actions.style.display='block';return;}const api=(window.GQ_CONFIG.API_BASE||'').replace(/\/$/,'');try{const r=await fetch(api+'/api/checkout-status?session_id='+encodeURIComponent(sessionId)+'&order_id='+encodeURIComponent(orderId));const d=await r.json();if(!r.ok||!d.paid)throw new Error(d.error||'Zahlung konnte nicht bestätigt werden.');title.textContent='Vielen Dank – die GeburtstagsQuest ist bezahlt.';status.textContent='Deine Bestellung ist sicher erfasst. Als Nächstes wird das personalisierte Abenteuer erstellt.';localStorage.setItem('geburtstagsquest_paid_order_id',orderId);actions.style.display='block';}catch(e){title.textContent='Zahlungsstatus noch nicht bestätigt';status.textContent='Die Bestellung ist vorhanden, aber die Zahlungsbestätigung konnte gerade nicht abgerufen werden.';actions.style.display='block';}})();</script></body></html>
